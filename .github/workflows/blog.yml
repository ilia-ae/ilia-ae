name: Latest blog posts
on:
  schedule:
    - cron: "30 5 * * *"   # daily 05:30 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: English posts -> README.md
        uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://ilia.ae/en/feed/"
          readme_path: "./README.md"
          max_post_count: 6
          commit_message: "chore: refresh recent writing (EN)"
      - name: Russian posts -> README.ru.md
        uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://ilia.ae/feed/"
          readme_path: "./README.ru.md"
          max_post_count: 6
          commit_message: "chore: refresh recent writing (RU)"
