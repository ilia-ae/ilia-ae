name: Latest blog posts
on:
  schedule:
    - cron: "30 5 * * *"   # daily 05:30 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build post cards from the site RSS
        run: |
          pip install --quiet pillow==11.0.0
          python posts.py
      - name: Commit if anything changed
        run: |
          git add -A README.md README.ru.md assets/posts
          if git diff --cached --quiet; then echo "no new posts"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh recent writing"
          git push
